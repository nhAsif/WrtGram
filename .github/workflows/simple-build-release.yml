name: Build and Release WrtGram

on:
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'etc/**'
      - 'sbin/**'
      - 'usr/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      current_version: ${{ steps.current_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get New Version
        id: version
        run: |
          echo "version=$(grep 'PKG_VERSION:=' Makefile | cut -d'=' -f2 | xargs)" >> $GITHUB_OUTPUT
          echo "release=$(grep 'PKG_RELEASE:=' Makefile | cut -d'=' -f2 | xargs)" >> $GITHUB_OUTPUT

      - name: Get Current Release Version
        id: current_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try to get the latest release tag
          LATEST_TAG=$(gh release view --json tagName --template '{{.tagName}}' 2>/dev/null || echo "v0.0.0")
          echo "version=${LATEST_TAG#v}" >> $GITHUB_OUTPUT

  compile:
    needs: get-version
    runs-on: ubuntu-latest
    # if: ${{ needs.get-version.outputs.version != needs.get-version.outputs.current_version || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: ipk, sdk_url: "https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz", sdk_tar: "SDK.tar.xz", sdk_dir: "SDK" }
          - { name: apk, sdk_url: "snapshot", sdk_tar: "SNAPSDK.tar.zst", sdk_dir: "SNAPSDK" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git tar zstd python3 python3-pyelftools python3-setuptools build-essential libncurses5-dev gawk gettext unzip file

      - name: Download SDK
        run: |
          mkdir -p tmp
          if [ "${{ matrix.target.name }}" = "ipk" ]; then
            curl -SL "${{ matrix.target.sdk_url }}" -o "./tmp/${{ matrix.target.sdk_tar }}"
            cd tmp
            tar -xf ${{ matrix.target.sdk_tar }}
            SDK_DIR=$(ls -d openwrt-sdk-*)
            mv "$SDK_DIR" "../${{ matrix.target.sdk_dir }}"
          else
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/"
            SDK_NAME=$(curl -s $BASE_URL | grep -oE 'openwrt-sdk-x86-64[^"]+\.tar\.zst' | head -n 1)
            curl -SL "$BASE_URL/$SDK_NAME" -o "./tmp/${{ matrix.target.sdk_tar }}"
            cd tmp
            zstd -d ${{ matrix.target.sdk_tar }}
            tar -xf SNAPSDK.tar
            SDK_DIR=$(tar -tf SNAPSDK.tar | head -n 1 | cut -d/ -f1)
            mv "$SDK_DIR" "../${{ matrix.target.sdk_dir }}"
          fi

      - name: Build Package
        run: |
          cd ${{ matrix.target.sdk_dir }}
          
          # Add package source
          mkdir -p package/wrtgram
          cp -r ../Makefile ../etc ../sbin ../usr package/wrtgram/
          
          # Fix line endings (OpenWrt build system hates CRLF)
          find package/wrtgram -type f -exec sed -i 's/\r//g' {} +
          
          # Initialize SDK and build
          make defconfig
          make package/wrtgram/compile V=s
          
          # Find built package
          PKG_FILE=$(find bin/ -name "wrtgram*.${{ matrix.target.name }}" | head -n 1)
          if [ -z "$PKG_FILE" ]; then
            echo "❌ Package not found!"
            find bin/ -type f
            exit 1
          fi
          
          # Rename for clarity and move to artifact dir
          VERSION="${{ needs.get-version.outputs.version }}"
          RELEASE="${{ needs.get-version.outputs.release }}"
          FINAL_NAME="wrtgram_${VERSION}-${RELEASE}_all.${{ matrix.target.name }}"
          cp "$PKG_FILE" "../$FINAL_NAME"
          echo "✅ Created: $FINAL_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrtgram-${{ matrix.target.name }}
          path: wrtgram*.${{ matrix.target.name }}

  release:
    needs: [get-version, compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          configurationJson: |
            {
              "mode": "COMMIT",
              "template": "# Changelog\n\n${{ '{{' }}CHANGELOG}}",
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feat", "feature"],
                  "patterns": ["feat:.*", "feature:.*"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["fix", "bug"],
                  "patterns": ["fix:.*", "bug:.*"]
                },
                {
                  "title": "## 📝 Documentation",
                  "labels": ["docs"],
                  "patterns": ["docs:.*"]
                },
                {
                  "title": "## ⚙️ Maintenance",
                  "labels": ["chore", "ci"],
                  "patterns": ["chore:.*", "ci:.*"]
                }
              ],
              "unmapped_category": {
                "title": "## 📦 Other Changes"
              }
            }

      - name: Create package repository index
        run: |
          mkdir -p repo
          cp artifacts/* repo/
          cd repo
          
          # Create opkg index for ipk
          # We only have one ipk, but let's make it look like a repo
          for ipk in *.ipk; do
            if [ -f "$ipk" ]; then
              echo "Package: wrtgram"
              echo "Version: ${{ needs.get-version.outputs.version }}-${{ needs.get-version.outputs.release }}"
              echo "Architecture: all"
              echo "Filename: $ipk"
              echo "Size: $(stat -c%s "$ipk")"
              echo "SHA256sum: $(sha256sum "$ipk" | cut -d' ' -f1)"
              echo "Description: Telegram BOT for OpenWrt"
              echo ""
            fi
          done > Packages
          gzip -c Packages > Packages.gz
          
          # Simple HTML index
          echo '<!DOCTYPE html><html><head><title>WrtGram Repository</title><style>body{font-family:sans-serif;margin:40px;line-height:1.6}pre{background:#f4f4f4;padding:10px;border-radius:5px}</style></head><body>' > index.html
          echo '<h1>WrtGram Download</h1>' >> index.html
          echo '<p>Latest version: <b>${{ needs.get-version.outputs.version }}-${{ needs.get-version.outputs.release }}</b></p>' >> index.html
          echo '<h3>Installation (OpenWrt 23.05 and earlier):</h3>' >> index.html
          echo '<pre>opkg update\nopkg install <a href="wrtgram_${{ needs.get-version.outputs.version }}-${{ needs.get-version.outputs.release }}_all.ipk">wrtgram_all.ipk</a></pre>' >> index.html
          echo '<h3>Installation (OpenWrt 25 and later):</h3>' >> index.html
          echo '<pre>apk add <a href="wrtgram_${{ needs.get-version.outputs.version }}-${{ needs.get-version.outputs.release }}_all.apk">wrtgram_all.apk</a></pre>' >> index.html
          echo '<h3>All Files:</h3><ul>' >> index.html
          for f in *; do
            if [ "$f" != "index.html" ]; then
              echo "<li><a href=\"$f\">$f</a></li>" >> index.html
            fi
          done
          echo '</ul></body></html>' >> index.html

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: WrtGram v${{ needs.get-version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            artifacts/*
            repo/Packages
            repo/Packages.gz
            repo/index.html
          draft: false
          prerelease: false
